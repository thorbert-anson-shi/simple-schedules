services:
  backend:
    image: tobtoby/simple-schedules:latest
    ports:
      - 3000:3000
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy

  db:
    image: dhi.io/postgres:18-alpine3.24@sha256:0ba4765086acf65ac548c04f48588a64e3d9cee7c3255ab8f1594ac3fd2f60e0
    env_file:
      - .env.db
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d simple-schedules']
      interval: 5s
      retries: 5

volumes:
  db_data:
